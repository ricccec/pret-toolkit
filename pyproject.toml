[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pret-toolkit"
version = "0.5.0"
description = "Python tools to read, edit, build and run a pret/RGBDS Gen-2 disassembly"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ricccec", email = "65662894+ricccec@users.noreply.github.com"}]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pret-sym   = "pret_toolkit.sym_lookup:main"
pret-usage = "pret_toolkit.usage:main"
pret-test  = "pret_toolkit.testing.runner:main"

[project.urls]
Source = "https://github.com/ricccec/pret-toolkit"
Issues = "https://github.com/ricccec/pret-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pret-test]

[tool.pret-test.upstreams.pokecrystal]
url = "https://github.com/pret/pokecrystal"
commit = "31880ea20ea44f79ebd459b1e735ae1f15db1671"

[tool.pret-test.upstreams.polishedcrystal]
url = "https://github.com/Rangi42/polishedcrystal"
commit = "a79dd2a36d00449b4961a119a1098e3aa318364f"
